<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runewood UI interactive preview</title><style>
*{box-sizing:border-box} body{margin:0;background:#1b3032;color:#f8e8bf;font:16px system-ui} header{padding:16px;text-align:center} h1{font-size:clamp(24px,4vw,38px);margin:0} .status{background:#672b25;padding:8px;text-align:center}.layout{max-width:1050px;margin:auto;display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(300px,1fr);gap:14px;padding:16px}.panel{position:relative;aspect-ratio:1480/1118}.panel>img{width:100%;height:100%;display:block}.panelbody{position:absolute;inset:21% 13% 16%;color:#292014;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}.panelbody p{margin:0}.panelbody h2{margin:0;font-size:clamp(18px,3vw,28px)}.action{width:min(78%,230px);aspect-ratio:2204/756;border:0;padding:0;background:transparent;position:relative;cursor:pointer;color:#241a10;font:700 16px system-ui}.action img,.square img{width:100%;height:100%;display:block}.action span{position:absolute;inset:0;display:grid;place-items:center}.action:focus-visible,.square:focus-visible{outline:3px solid #fff;outline-offset:3px}.side{padding:12px}.hud{position:relative;width:min(100%,450px);aspect-ratio:2204/756}.hud img{position:absolute;width:100%;height:100%}.hud .fill{left:8%;width:84%;top:12%;height:75%;clip-path:inset(0 36.32% 0 0)}.iconrow{display:flex;gap:8px;flex-wrap:wrap}.square{position:relative;width:72px;height:72px;border:0;padding:0;background:transparent;cursor:pointer}.square .icon{position:absolute;inset:20%;width:60%;height:60%;object-fit:contain}.slot{position:relative;width:72px;height:72px;padding:0;border:0;background:transparent;cursor:pointer}.slot:focus-visible{outline:3px solid white;outline-offset:3px}.slot img{position:absolute;left:0;top:0;width:100%;height:100%}.slot img+img{left:22%;top:22%;width:56%;height:56%;object-fit:contain}.inventory{display:flex;gap:6px;flex-wrap:wrap}.dialog{position:relative;aspect-ratio:1806/919;max-width:500px}.dialog img{width:100%;height:100%}.dialog p{position:absolute;inset:25% 14% 20%;margin:0;color:#2b2013;text-align:center;font-size:clamp(12px,2vw,16px)}label{display:block;margin:8px 0}input{max-width:75%}.hidden{display:none}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:8px}.panelbody{gap:2px}.panelbody h2{font-size:16px}.action{width:min(70%,220px);font-size:13px}.panelbody p{display:none}.side{padding:8px}.dialog p{font-size:13px}}
</style></head><body><div class="status">Interactive preview · artwork included in the pack</div><header><h1>Runewood UI</h1><p>A fantasy interface starter pack</p></header><main class="layout"><section class="panel"><img src="assets/menu-panel-clean-v01.png" alt=""><div class="panelbody"><h2>Adventure Menu</h2><p>Choose your next step</p><button class="action" data-action="continue"><img src="assets/wide-normal-v01.png" data-normal="assets/wide-normal-v01.png" data-pressed="assets/wide-pressed-v01.png" alt=""><span>Continue</span></button><button class="action" data-action="settings"><img src="assets/wide-normal-v01.png" data-normal="assets/wide-normal-v01.png" data-pressed="assets/wide-pressed-v01.png" alt=""><span>Settings</span></button></div></section><section class="side"><h2>HUD and inventory</h2><label>Health <input id="hp" type="range" min="0" max="100" value="65"> <output id="amount">65%</output></label><div class="hud"><img src="assets/health-track-clean-v01.png" alt="Health track"><img class="fill" id="fill" src="assets/health-fill-clean-v01.png" alt=""></div><div class="iconrow"><button class="square" data-action="settings" aria-label="Open settings"><img src="assets/square-normal-v01.png" data-normal="assets/square-normal-v01.png" data-pressed="assets/square-pressed-v01.png" alt=""><img class="icon" src="assets/settings-icon-clean-v01.png" alt=""></button><button class="square" data-action="close" aria-label="Close message"><img src="assets/square-normal-v01.png" data-normal="assets/square-normal-v01.png" data-pressed="assets/square-pressed-v01.png" alt=""><img class="icon" src="assets/close-icon-clean-v01.png" alt=""></button></div><h3>Inventory</h3><div class="inventory" id="items"></div><div class="dialog" id="dialog"><img src="assets/dialog-panel-clean-v01.png" alt=""><p id="message">Select an item, adjust health, or open settings.</p></div></section></main><script>
const names=['heart','coin','sword','shield','potion','backpack'];const files=['health','coin','sword','shield','potion','backpack'];const items=document.querySelector('#items');files.forEach((f,i)=>{const b=document.createElement('button');b.className='slot';b.type='button';b.setAttribute('aria-label',names[i]);b.innerHTML=`<img src="assets/inventory-slot-clean-v01.png" alt=""><img src="assets/${f}-icon-clean-v01.png" alt="">`;b.onclick=()=>show('Selected: '+names[i]);items.appendChild(b)});const msg=document.querySelector('#message'),dialog=document.querySelector('#dialog');function show(s){dialog.classList.remove('hidden');msg.textContent=s}document.querySelectorAll('[data-action]').forEach(b=>{const a=b.querySelector('img[data-normal]');function set(v){a.src=v?a.dataset.pressed:a.dataset.normal}b.addEventListener('pointerdown',()=>set(true));b.addEventListener('pointerup',()=>set(false));b.addEventListener('pointercancel',()=>set(false));b.addEventListener('blur',()=>set(false));b.addEventListener('pointerleave',()=>set(false));b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')set(true)});b.addEventListener('keyup',()=>set(false));b.onclick=()=>b.dataset.action==='close'?dialog.classList.add('hidden'):show(b.dataset.action==='settings'?'Settings opened.':'Adventure continues!')});const hp=document.querySelector('#hp');hp.oninput=()=>{document.querySelector('#fill').style.clipPath=`inset(0 ${(90 + 2030 * (1 - Number(hp.value) / 100)) / 2204 * 100}% 0 0)`;document.querySelector('#amount').textContent=hp.value+'%'};
</script></body></html>
